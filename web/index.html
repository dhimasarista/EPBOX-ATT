<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Employee attendance management app by EPBOX.">

  <!-- PWA / theme -->
  <meta name="theme-color" content="#0F1C3F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EPBOX Absensi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EPBOX Employee Attendance</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Loading splash */
    body {
      background-color: #0F1C3F;
      margin: 0;
    }
    /* Sembunyikan file input yang dibuat Flutter/image_picker_for_web
       agar tidak flash saat pertama dimuat.
       Catatan: di web kamera kini menggunakan getUserMedia langsung,
       bukan input[type=file], sehingga aturan ini hanya bersifat kosmetik. */
    flt-glass-pane input[type="file"],
    body > input[type="file"] {
      opacity: 0 !important;
      position: fixed !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
